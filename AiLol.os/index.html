<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL INTERFACE V5 (LAYOUT FIX)</title>
    
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        /* --- VARIABLES THEMES --- */
        :root { --bg: #fff; --text: #000; }

        /* THEME 1: BRUTALISM */
        body.theme-brutal {
            --bg: #f2f2f2;
            --surface: #ffffff;
            --text: #121212;
            --border: 3px solid #121212;
            --shadow: 5px 5px 0px #121212;
            --green: #4ade80;
            --red: #ef4444;
            --yellow: #facc15;
            --blue: #3b82f6;
            --purple: #a855f7;
            --font-main: 'Space Mono', monospace;
            --radius: 0px;
        }

        /* THEME 2: GLASS */
        body.theme-glass {
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.9);
            --text: #e2e8f0;
            --border: 1px solid rgba(148, 163, 184, 0.2);
            --shadow: 0 10px 30px rgba(0,0,0,0.5);
            --green: #10b981;
            --red: #f43f5e;
            --yellow: #f59e0b;
            --blue: #60a5fa;
            --purple: #c084fc;
            --font-main: 'Inter', sans-serif;
            --radius: 16px;
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        /* --- GLOBAL --- */
        * { box-sizing: border-box; } /* CRUCIAL pour que le padding ne casse pas la hauteur */

        body {
            font-family: var(--font-main);
            background-color: var(--bg);
            color: var(--text);
            margin: 0; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            transition: background 0.3s;
        }

        /* --- TOP BAR --- */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: var(--surface); border-bottom: var(--border);
            z-index: 50; height: 70px; flex-shrink: 0;
        }
        
        .logo-group { display: flex; align-items: center; gap: 15px; }
        .logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -1px; text-transform: uppercase; }
        
        .chip {
            font-size: 0.7rem; padding: 4px 8px; border: 1px solid var(--text); 
            font-weight: bold; text-transform: uppercase; background: var(--bg);
        }

        .top-actions button {
            background: transparent; border: var(--border); color: var(--text);
            padding: 8px 15px; cursor: pointer; font-family: inherit; font-weight: bold;
            box-shadow: var(--shadow); margin-left: 10px; border-radius: var(--radius);
        }
        .top-actions button:active { transform: translate(2px, 2px); box-shadow: none; }

        /* --- LAYOUT --- */
        .main-container {
            display: grid; grid-template-columns: 1fr 400px; gap: 20px; padding: 20px;
            height: calc(100vh - 70px);
        }

        /* CHAT AREA */
        .chat-wrapper {
            background: var(--surface); border: var(--border); border-radius: var(--radius);
            box-shadow: var(--shadow); position: relative; overflow: hidden;
            display: flex; flex-direction: column;
        }

        .status-badge {
            position: absolute; top: 20px; left: 20px; background: var(--surface);
            padding: 8px 15px; border: var(--border); font-weight: bold; z-index: 5;
            display: flex; gap: 10px; align-items: center; border-radius: var(--radius);
            font-size: 0.8rem; box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }

        /* CORRECTION MAJEURE ICI : Structure des messages */
        #chat-history {
            flex: 1; 
            overflow-y: auto; 
            padding: 80px 20px 20px 20px;
            display: flex; 
            flex-direction: column; 
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            width: fit-content; /* S'adapte au texte */
            padding: 15px;
            border: var(--border);
            border-radius: var(--radius);
            font-size: 0.95rem;
            line-height: 1.6;
            position: relative;
            word-wrap: break-word; /* Coupe les mots si trop longs */
            word-break: break-word;
            height: auto; /* Hauteur auto pour englober le texte */
            display: block;
        }

        .msg-user {
            align-self: flex-end; 
            background: var(--text); 
            color: var(--bg);
            box-shadow: -5px 5px 0 rgba(128,128,128,0.3);
        }
        
        .msg-ai {
            align-self: flex-start; 
            background: var(--surface); 
            color: var(--text);
            box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
        }

        /* Texte de chargement et curseur */
        .loading-text {
            font-family: monospace; font-size: 0.8rem; color: var(--purple);
            font-weight: bold; display: flex; align-items: center; gap: 10px;
        }
        
        .blink-cursor::after {
            content: '█'; 
            display: inline-block;
            animation: blink 1s infinite; 
            margin-left: 5px;
            vertical-align: bottom;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* INPUT AREA */
        .chat-input-area {
            padding: 20px; border-top: var(--border); background: var(--surface);
            display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0;
        }
        .chat-input-area textarea {
            flex: 1; padding: 15px; background: rgba(0,0,0,0.05);
            border: 2px solid var(--text); color: var(--text);
            font-family: inherit; border-radius: 4px; resize: none; height: 60px;
            transition: height 0.2s;
        }
        .chat-input-area textarea:focus { outline: none; background: rgba(0,0,0,0.08); height: 80px; }

        /* RIGHT PANEL */
        .controls-wrapper { display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-right: 5px; }
        
        .panel {
            background: var(--surface); border: var(--border); padding: 15px;
            border-radius: var(--radius); box-shadow: var(--shadow);
        }
        .panel h3 { margin: 0 0 15px 0; font-size: 0.9rem; text-transform: uppercase; border-bottom: 2px solid var(--text); padding-bottom: 5px; }

        .input-group label { font-size: 0.7rem; text-transform: uppercase; display: block; margin-bottom: 5px; opacity: 0.7; font-weight: bold; }
        .input-group select, .input-group input {
            width: 100%; padding: 10px; background: rgba(0,0,0,0.05);
            border: 1px solid var(--text); color: var(--text);
            font-family: inherit; border-radius: 4px; font-size: 0.85rem;
        }

        /* METRICS & TOOLS */
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .metric-box {
            background: rgba(0,0,0,0.03); border: 1px solid var(--text); padding: 8px;
            border-radius: 4px; text-align: center;
        }
        .metric-val { font-size: 1.1rem; font-weight: bold; display: block; }
        .metric-lbl { font-size: 0.6rem; text-transform: uppercase; opacity: 0.7; }
        .meter-container { height: 6px; background: #ddd; margin-top: 5px; width: 100%; border-radius: 3px; overflow: hidden; }
        .meter-fill { height: 100%; background: var(--blue); width: 0%; transition: width 0.3s; }

        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tool-btn {
            background: transparent; border: 1px solid var(--text); padding: 8px;
            cursor: pointer; font-size: 0.75rem; text-transform: uppercase; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 5px;
            color: var(--text); transition: all 0.1s;
        }
        .tool-btn:hover { background: rgba(0,0,0,0.05); }

        .btn-big {
            padding: 12px; border: var(--border); font-family: inherit; font-weight: bold; font-size: 0.9rem; width: 100%;
            cursor: pointer; box-shadow: var(--shadow); border-radius: var(--radius); transition: all 0.1s; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-big:active { transform: translate(2px, 2px); box-shadow: none; }
        .btn-load { background: var(--blue); color: white; }
        .btn-send { background: var(--text); color: var(--bg); width: auto; padding: 0 25px; height: 60px; }

        .global-progress { margin-top: 10px; border: 2px solid var(--text); height: 20px; display: none; position: relative; background: #fff; }
        .gp-bar { height: 100%; background: var(--green); width: 0%; }
        .gp-text { position: absolute; width: 100%; text-align: center; top: 0; font-size: 0.7rem; line-height: 18px; font-weight: bold; mix-blend-mode: hard-light; }
    </style>
</head>
<body class="theme-brutal">

    <div class="top-bar">
        <div class="logo-group">
            <div class="logo"><i class="fas fa-network-wired"></i> NEURAL.CHAT</div>
            <div class="chip" id="hardwareChip">HARDWARE CHECK...</div>
        </div>
        <div class="top-actions">
            <button onclick="toggleTheme()"><i class="fas fa-adjust"></i> STYLE</button>
        </div>
    </div>

    <div class="main-container">
        
        <div class="chat-wrapper">
            <div id="statusBadge" class="status-badge" style="color:var(--text); border-color:var(--text)">
                <i class="fas fa-circle-notch"></i> <span>EN ATTENTE</span>
            </div>
            
            <div id="chat-history">
                <div class="message msg-ai">
                    Salut. Configure le modèle à droite pour commencer.<br>
                    Le texte s'affichera correctement à l'intérieur de la boîte.
                </div>
            </div>

            <div class="chat-input-area">
                <textarea id="userInput" placeholder="Écris ton message ici... (Entrée pour envoyer)"></textarea>
                <button class="btn-big btn-send" id="btnSend">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <div class="controls-wrapper">
            <!-- PANEL MODEL -->
            <div class="panel">
                <h3><i class="fas fa-server"></i> Modèle</h3>
                <div class="input-group">
                    <label id="engineLabel">Moteur</label>
                    <select id="modelSelect"></select>
                </div>
                <div class="global-progress" id="dlProgress">
                    <div class="gp-bar" id="dlBar"></div>
                    <div class="gp-text" id="dlText">0%</div>
                </div>
                <button id="btnLoad" class="btn-big btn-load" style="margin-top: 15px;">
                    <i class="fas fa-power-off"></i> INITIALISER
                </button>
            </div>

            <!-- PANEL STATS -->
            <div class="panel">
                <h3><i class="fas fa-chart-line"></i> Performance</h3>
                <div class="metrics-grid">
                    <div class="metric-box">
                        <span class="metric-val" id="metSpeed">0</span>
                        <span class="metric-lbl">TOK/SEC</span>
                        <div class="meter-container"><div class="meter-fill" id="barSpeed"></div></div>
                    </div>
                    <div class="metric-box">
                        <span class="metric-val" id="metTTFT">0ms</span>
                        <span class="metric-lbl">1er TOKEN</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-val" id="metTime">0s</span>
                        <span class="metric-lbl">TEMPS TOTAL</span>
                    </div>
                    <div class="metric-box">
                        <span class="metric-val" id="metUsed">0</span>
                        <span class="metric-lbl">TOKENS</span>
                    </div>
                </div>
            </div>

            <!-- PANEL PARAM -->
            <div class="panel">
                <h3><i class="fas fa-sliders-h"></i> Paramètres</h3>
                <div class="input-group">
                    <label>System Prompt</label>
                    <input type="text" id="sysPrompt" value="Tu es un assistant utile et concis.">
                </div>
                <div class="input-group" style="margin-top:10px;">
                    <label>Température</label>
                    <input type="range" id="tempRange" min="0" max="1" step="0.1" value="0.7">
                </div>
            </div>

            <!-- PANEL TOOLS -->
            <div class="panel">
                <h3><i class="fas fa-tools"></i> Outils</h3>
                <div class="tools-grid">
                    <button class="tool-btn" onclick="exportChat()"><i class="fas fa-file-export"></i> Exporter</button>
                    <button class="tool-btn" onclick="copyLast()"><i class="fas fa-copy"></i> Copier</button>
                    <button class="tool-btn" onclick="resetChat()" style="color:var(--red); border-color:var(--red);"><i class="fas fa-trash"></i> Reset</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIQUE (Fix stream + affichage) -->
    <script type="module">
        import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

        env.allowLocalModels = false;
        env.useBrowserCache = true;

        // UI REFERENCES
        const ui = {
            userInput: document.getElementById('userInput'),
            chatHistory: document.getElementById('chat-history'),
            btnSend: document.getElementById('btnSend'),
            btnLoad: document.getElementById('btnLoad'),
            modelSelect: document.getElementById('modelSelect'),
            statusBadge: document.getElementById('statusBadge'),
            dlProgress: document.getElementById('dlProgress'),
            dlBar: document.getElementById('dlBar'),
            dlText: document.getElementById('dlText'),
            hwChip: document.getElementById('hardwareChip'),
            metSpeed: document.getElementById('metSpeed'),
            barSpeed: document.getElementById('barSpeed'),
            metTTFT: document.getElementById('metTTFT'),
            metTime: document.getElementById('metTime'),
            metUsed: document.getElementById('metUsed')
        };

        // GLOBAL STATE
        let state = {
            engineType: 'cpu', 
            engine: null,
            isGenerating: false,
            context: [],
            lastUserMsg: ""
        };

        // MODELS
        const MODELS = {
            webgpu: [
                { id: "Llama-3.2-1B-Instruct-q4f32_1-MLC", name: "Llama 3.2 1B (Recommandé)" },
                { id: "Gemma-2-2b-it-q4f32_1-MLC", name: "Gemma 2 2B (Léger)" },
                { id: "Llama-3.2-3B-Instruct-q4f32_1-MLC", name: "Llama 3.2 3B (Lourd)" }
            ],
            cpu: [
                { id: "Xenova/TinyLlama-1.1B-Chat-v1.0", name: "TinyLlama 1.1B (Standard)" },
                { id: "Xenova/Qwen1.5-0.5B-Chat", name: "Qwen 0.5B (Très Rapide)" }
            ]
        };

        // 1. HARDWARE DETECTION
        window.onload = async () => {
            if (navigator.gpu) {
                try {
                    const adapter = await navigator.gpu.requestAdapter();
                    if(adapter) {
                        state.engineType = 'webgpu';
                        ui.hwChip.innerText = "GPU DETECTÉ (WebLLM)";
                        ui.hwChip.style.background = "var(--green)";
                    }
                } catch(e) { /* Fallback */ }
            }
            if(state.engineType === 'cpu') {
                ui.hwChip.innerText = "MODE CPU (Transformers.js)";
                ui.hwChip.style.background = "var(--yellow)";
            }
            
            const list = MODELS[state.engineType];
            ui.modelSelect.innerHTML = list.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
        };

        // 2. LOAD ENGINE
        ui.btnLoad.addEventListener('click', async () => {
            const modelId = ui.modelSelect.value;
            ui.btnLoad.disabled = true;
            ui.dlProgress.style.display = 'block';
            setStatus("CHARGEMENT...", "fa-download", "var(--blue)");

            try {
                if (state.engineType === 'webgpu') {
                    state.engine = await CreateMLCEngine(modelId, {
                        initProgressCallback: (report) => {
                            ui.dlText.innerText = report.text;
                            if(report.progress) ui.dlBar.style.width = (report.progress * 100) + "%";
                        }
                    });
                } else {
                    state.engine = await pipeline('text-generation', modelId, {
                        progress_callback: (data) => {
                            if(data.status === 'progress') {
                                const p = data.progress || 0;
                                ui.dlBar.style.width = p + "%";
                                ui.dlText.innerText = Math.round(p) + "%";
                            }
                        }
                    });
                }
                
                setStatus("PRÊT", "fa-check", "var(--green)");
                ui.btnLoad.innerText = "MOTEUR ACTIF";
                ui.btnLoad.style.background = "var(--green)";
                ui.btnLoad.style.color = "#000";
                ui.dlProgress.style.display = 'none';

            } catch (err) {
                alert("Erreur de chargement: " + err.message);
                ui.btnLoad.disabled = false;
                setStatus("ERREUR", "fa-times", "var(--red)");
            }
        });

        // 3. SEND MESSAGE
        async function handleSend() {
            const text = ui.userInput.value.trim();
            if (!text) return;

            ui.userInput.value = '';
            addMessage(text, 'msg-user');
            
            if (!state.engine) {
                addMessage("Erreur: Initialise le modèle d'abord !", 'msg-ai', true);
                return;
            }
            if (state.isGenerating) return;

            state.isGenerating = true;
            setStatus("CALCUL EN COURS...", "fa-brain", "var(--purple)");

            // Creation bulle IA avec loader textuel
            const aiMsgDiv = addMessage("", 'msg-ai');
            aiMsgDiv.innerHTML = '<div class="loading-text"><i class="fas fa-microchip fa-spin"></i> TRAITEMENT...</div>';
            scrollToBottom();

            let fullText = "";
            let tokenCount = 0;
            const tStart = performance.now();
            let tFirst = 0;
            
            // Timeout sécurité
            const safetyTimeout = setTimeout(() => {
                if (!tFirst) {
                    aiMsgDiv.innerHTML = "<span style='color:var(--red)'>[Timeout: Modèle trop lent ou bloqué.]</span>";
                    state.isGenerating = false;
                    setStatus("TIMEOUT", "fa-clock", "var(--red)");
                }
            }, 30000);

            try {
                const sysPrompt = document.getElementById('sysPrompt').value;
                const temp = parseFloat(document.getElementById('tempRange').value);

                if (state.engineType === 'webgpu') {
                    const messages = [
                        { role: "system", content: sysPrompt },
                        ...state.context,
                        { role: "user", content: text }
                    ];

                    const chunks = await state.engine.chat.completions.create({
                        messages, temperature: temp, stream: true
                    });

                    for await (const chunk of chunks) {
                        const content = chunk.choices[0]?.delta?.content || "";
                        if (content) {
                            if (!tFirst) {
                                tFirst = performance.now();
                                aiMsgDiv.innerHTML = ""; 
                            }
                            fullText += content;
                            aiMsgDiv.innerText = fullText;
                            aiMsgDiv.classList.add('blink-cursor');
                            scrollToBottom();
                            tokenCount++;
                        }
                    }
                } else {
                    // CPU FALLBACK
                    const prompt = `<|user|>\n${text}\n<|assistant|>\n`;
                    await state.engine(prompt, {
                        max_new_tokens: 150, temperature: temp, do_sample: true,
                        callback_function: (beams) => {
                            const decoded = state.engine.tokenizer.decode(beams[0].output_token_ids, { skip_special_tokens: true });
                            let clean = decoded.split("<|assistant|>").pop() || decoded;
                            
                            if (clean.trim().length > 0 && !tFirst) {
                                tFirst = performance.now();
                                aiMsgDiv.innerHTML = ""; 
                            }
                            if (clean.length > fullText.length) {
                                fullText = clean;
                                aiMsgDiv.innerText = fullText;
                                aiMsgDiv.classList.add('blink-cursor');
                                scrollToBottom();
                                tokenCount++;
                            }
                        }
                    });
                }
                
                clearTimeout(safetyTimeout);
                aiMsgDiv.classList.remove('blink-cursor');

                state.context.push({ role: "user", content: text });
                state.context.push({ role: "assistant", content: fullText });
                
                // Stats
                const tEnd = performance.now();
                const totalTime = (tEnd - tStart) / 1000;
                ui.metTime.innerText = totalTime.toFixed(2) + "s";
                ui.metTTFT.innerText = tFirst ? (tFirst - tStart).toFixed(0) + "ms" : "N/A";
                const tps = tokenCount / totalTime;
                ui.metSpeed.innerText = tps.toFixed(1);
                ui.barSpeed.style.width = Math.min(tps * 2, 100) + "%"; 
                ui.metUsed.innerText = tokenCount;

                setStatus("PRÊT", "fa-check", "var(--green)");

            } catch (e) {
                clearTimeout(safetyTimeout);
                console.error(e);
                aiMsgDiv.innerHTML = `<span style="color:var(--red)">Erreur: ${e.message}</span>`;
                setStatus("ERREUR", "fa-exclamation", "var(--red)");
            }
            state.isGenerating = false;
        }

        // --- UI HELPERS ---
        ui.btnSend.addEventListener('click', handleSend);
        ui.userInput.addEventListener('keydown', (e) => {
            if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
        });

        function addMessage(text, className, isError=false) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            if(isError) div.style.color = "var(--red)";
            div.innerText = text;
            ui.chatHistory.appendChild(div);
            scrollToBottom();
            return div;
        }

        function scrollToBottom() { ui.chatHistory.scrollTop = ui.chatHistory.scrollHeight; }
        
        function setStatus(text, icon, colorVar) {
            const c = getComputedStyle(document.body).getPropertyValue(colorVar.replace('var(','').replace(')','')) || colorVar;
            ui.statusBadge.innerHTML = `<i class="fas ${icon}"></i> <span>${text}</span>`;
            ui.statusBadge.style.color = c;
            ui.statusBadge.style.borderColor = c;
        }

        // GLOBALS
        window.toggleTheme = () => document.body.className = document.body.className.includes('brutal') ? 'theme-glass' : 'theme-brutal';
        window.resetChat = () => { state.context = []; ui.chatHistory.innerHTML = '<div class="message msg-ai">Chat effacé.</div>'; if(state.engine?.resetChat) state.engine.resetChat(); };
        window.copyLast = () => { if(state.context.length) navigator.clipboard.writeText(state.context[state.context.length-1].content); };
        window.exportChat = () => {
            const blob = new Blob([state.context.map(m=>`[${m.role}] ${m.content}`).join('\n')], {type:'text/plain'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'chat.txt'; a.click();
        };

    </script>
</body>
</html>
